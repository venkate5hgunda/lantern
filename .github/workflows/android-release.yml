name: Signed Android prerelease
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # Enable only after installing the owner-controlled signing secrets.
    if: vars.LANTERN_PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and test viewer
        working-directory: web
        run: npm ci && npm test && npm run build && npm audit --audit-level=moderate
      - name: Test provisioning and coordinator
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node coordinator/worker.test.mjs
      - name: Qualify viewer in browsers
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.LANTERN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lantern-release.p12"
      - name: Build signed APK and receipts
        env:
          LANTERN_KEYSTORE_PATH: ${{ runner.temp }}/lantern-release.p12
          LANTERN_KEYSTORE_PASSWORD: ${{ secrets.LANTERN_KEYSTORE_PASSWORD }}
          LANTERN_KEY_ALIAS: ${{ secrets.LANTERN_KEY_ALIAS }}
          LANTERN_KEY_PASSWORD: ${{ secrets.LANTERN_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebugAndroidTest
          cd ..
          python3 scripts/package-android-release.py
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/releases/"$GITHUB_REF_NAME"/* \
            --verify-tag --prerelease --title "Lantern $GITHUB_REF_NAME" \
            --notes-file docs/releases/current.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lantern-release.p12"
